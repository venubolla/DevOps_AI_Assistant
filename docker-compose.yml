services:

  postgres:
    image: pgvector/pgvector:pg16

    container_name: devops-ai-postgres

    environment:
      POSTGRES_DB: devops_ai
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d devops_ai"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
